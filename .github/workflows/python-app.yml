name: Python application

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  IMAGE_NAME: akemiiih/senai_api

permissions:
  contents: read

jobs:

  BUILD:
    name: Compilar Projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with App
        run: |
          PYTHONPATH=. pytest test/ -v --tb=short

  IMAGEM:
    name: Construindo Imagem no Docker
    runs-on: ubuntu-latest
    needs: BUILD
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USUARIO }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  DEPLOY_HOMOL:
    name: Deploy em Homologação
    runs-on: ubuntu-latest
    needs: IMAGEM
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy na EC2 Homologação via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_HOMOL }}
          username: ${{ secrets.EC2_USERNAME_HOMOL }}
          key: ${{ secrets.EC2_SSH_KEY_HOMOL }}
          script: |
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop senai_api_homol 2>/dev/null || true
            sudo docker rm senai_api_homol 2>/dev/null || true
            sudo docker run --name senai_api_homol -d --restart unless-stopped -p 8080:8080 ${{ env.IMAGE_NAME }}:latest
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy Homologação feito com sucesso!"

  DEPLOY_PRD:
    name: Deploy em Produção
    runs-on: ubuntu-latest
    needs: IMAGEM
    if: github.ref == 'refs/heads/main'
    environment: producao
    steps:
      - name: Deploy na EC2 Produção via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker stop senai_api 2>/dev/null || true
            sudo docker rm senai_api 2>/dev/null || true
            sudo docker run --name senai_api -d --restart unless-stopped -p 80:8080 ${{ env.IMAGE_NAME }}:latest
            sleep 5
            curl -f http://localhost/health || exit 1
            echo "Deploy Produção feito com sucesso!"
