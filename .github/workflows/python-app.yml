name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  BUILD:
    name: Compilar Projeto
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with App
        run: |
          PYTHONPATH=. pytest test/ -v --tb=short

  IMAGEM:
    name: Construindo Imagem no Docker
    runs-on: ubuntu-latest
    needs: BUILD
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USUARIO }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            akemiiih/senai_api:latest
            akemiiih/senai_api:${{ github.sha }}

  DEPLOY:
    name: Implementando na EC2
    runs-on: ubuntu-latest
    needs: IMAGEM
    
    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Fazer pull da imagem atualizada do Docker Hub
            sudo docker pull akemiiih/senai_api:latest
            
            # Parar aplicação atual e remover container se existirem
            sudo docker stop senai_api 2>/dev/null || true
            sudo docker rm senai_api 2>/dev/null || true

            # Publicar o novo container (Porta externa 80 -> Porta interna do container 8080)
            sudo docker run --name senai_api -d --restart unless-stopped -p 80:8080 akemiiih/senai_api:latest

            # Verificar se publicou com sucesso testando a porta externa (80)
            sleep 5
            curl -f http://localhost/health || exit 1
            echo "Deploy feito com sucesso!"
